name: Candidate Parameter Validation

on:
  workflow_dispatch:
    inputs:
      operators:
        description: "Operadores produtivos disponiveis por dia"
        required: true
        default: "20"
      june_non_working_dates:
        description: "Dias sem planeamento em junho, separados por virgulas (YYYY-MM-DD)"
        required: false
        default: ""
      july_non_working_dates:
        description: "Dias sem planeamento em julho, separados por virgulas (YYYY-MM-DD)"
        required: false
        default: ""
      august_non_working_dates:
        description: "Dias sem planeamento em agosto, separados por virgulas (YYYY-MM-DD)"
        required: false
        default: ""

jobs:
  validate-candidate:
    name: "${{ matrix.candidate }} | ${{ matrix.instance }} | seed ${{ matrix.seed }}"
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        candidate: [best_june, best_july, best_august]
        instance: [june, july, august]
        seed: [42, 43, 44]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one validation job
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.candidate }}" in
            best_june)
              SOURCE_MONTH="june"
              POPULATION_SIZE="225"
              MUTATION_RATE="0.138525663"
              STAGNATION_K="46"
              ;;
            best_july)
              SOURCE_MONTH="july"
              POPULATION_SIZE="231"
              MUTATION_RATE="0.145441108"
              STAGNATION_K="55"
              ;;
            best_august)
              SOURCE_MONTH="august"
              POPULATION_SIZE="197"
              MUTATION_RATE="0.149941493"
              STAGNATION_K="54"
              ;;
          esac

          case "${{ matrix.instance }}" in
            june)
              INSTANCE_FILE="Inputs_June.xlsx"
              NON_WORKING_DATES="${{ inputs.june_non_working_dates }}"
              ;;
            july)
              INSTANCE_FILE="Inputs_July.xlsx"
              NON_WORKING_DATES="${{ inputs.july_non_working_dates }}"
              ;;
            august)
              INSTANCE_FILE="Inputs_August.xlsx"
              NON_WORKING_DATES="${{ inputs.august_non_working_dates }}"
              ;;
          esac

          python src/evaluate_candidate_single.py \
            --candidate "${{ matrix.candidate }}" \
            --source-month "$SOURCE_MONTH" \
            --population-size "$POPULATION_SIZE" \
            --mutation-rate "$MUTATION_RATE" \
            --stagnation-k "$STAGNATION_K" \
            --instance "${{ matrix.instance }}" \
            --instance-file "$INSTANCE_FILE" \
            --seed "${{ matrix.seed }}" \
            --operators "${{ inputs.operators }}" \
            --non-working-dates "$NON_WORKING_DATES"

      - name: Upload raw validation row
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-validation-${{ matrix.candidate }}-${{ matrix.instance }}-seed-${{ matrix.seed }}
          path: src/candidate_parameter_validation/raw_*.csv
          if-no-files-found: warn
          retention-days: 30

  aggregate-results:
    name: Aggregate candidate validation results
    runs-on: ubuntu-latest
    needs: validate-candidate
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download raw validation rows
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-validation-*
          path: downloaded_candidate_rows
          merge-multiple: true

      - name: Restore raw rows into output folder
        run: |
          mkdir -p src/candidate_parameter_validation
          cp downloaded_candidate_rows/raw_*.csv src/candidate_parameter_validation/
          ls -la src/candidate_parameter_validation/

      - name: Aggregate validation results
        run: python src/aggregate_candidate_validation.py

      - name: Upload candidate validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-parameter-validation-results
          path: src/candidate_parameter_validation/
          if-no-files-found: warn
          retention-days: 30
