name: Optuna - Instance Studies

on:
  workflow_dispatch:
    inputs:
      operators:
        description: "Operadores produtivos disponiveis por dia"
        required: true
        default: "20"
      june_non_working_dates:
        description: "Dias sem planeamento em junho, separados por virgulas (YYYY-MM-DD)"
        required: false
        default: ""
      july_non_working_dates:
        description: "Dias sem planeamento em julho, separados por virgulas (YYYY-MM-DD)"
        required: false
        default: ""
      august_non_working_dates:
        description: "Dias sem planeamento em agosto, separados por virgulas (YYYY-MM-DD)"
        required: false
        default: ""
      resume_run_id:
        description: "Run ID anterior para retomar a partir dos artifacts (opcional)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  optuna-instance-study:
    name: "Optuna ${{ matrix.instance }}"
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: june
            study_suffix: june_new_algo_30trials
            instance_file: Inputs_June.xlsx
            non_working_dates: ${{ inputs.june_non_working_dates }}
          - instance: july
            study_suffix: july_new_algo_30trials
            instance_file: Inputs_July.xlsx
            non_working_dates: ${{ inputs.july_non_working_dates }}
          - instance: august
            study_suffix: august_new_algo_30trials
            instance_file: Inputs_August.xlsx
            non_working_dates: ${{ inputs.august_non_working_dates }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Optuna checkpoints
        uses: actions/cache@v4
        with:
          path: |
            src/optuna_study_${{ matrix.study_suffix }}_v1.db
            src/optuna_results_${{ matrix.study_suffix }}_v1.csv
            src/optuna_seed_checkpoint_${{ matrix.study_suffix }}_v1.csv
            src/optuna_configuration_${{ matrix.study_suffix }}_v1.json
          key: optuna-${{ matrix.study_suffix }}-v1-${{ github.run_id }}
          restore-keys: |
            optuna-${{ matrix.study_suffix }}-v1-

      - name: Download previous study artifact
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: optuna-${{ matrix.instance }}-new-algo-30trials-study
          path: recovered_optuna
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - name: Restore downloaded study files
        if: ${{ inputs.resume_run_id != '' }}
        run: |
          find recovered_optuna -type f -name "optuna_*_${{ matrix.study_suffix }}_v1.*" -exec cp {} src/ \;
          ls -la src/optuna_*_${{ matrix.study_suffix }}_v1.* || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install Optuna visualisation dependencies
        run: pip install optuna plotly "kaleido==0.2.1" scikit-learn

      - name: Run Optuna study
        run: |
          python src/optuna_test.py \
            --study-suffix "${{ matrix.study_suffix }}" \
            --operators "${{ inputs.operators }}" \
            --instance-file "${{ matrix.instance_file }}" \
            --non-working-dates "${{ matrix.non_working_dates }}"

      - name: Generate Optuna figures
        if: always()
        run: python src/generate_optuna_figures.py --study-suffix "${{ matrix.study_suffix }}"
        continue-on-error: true

      - name: Upload study results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optuna-${{ matrix.instance }}-new-algo-30trials-study
          path: |
            src/optuna_study_${{ matrix.study_suffix }}_v1.db
            src/optuna_results_${{ matrix.study_suffix }}_v1.csv
            src/optuna_seed_checkpoint_${{ matrix.study_suffix }}_v1.csv
            src/optuna_configuration_${{ matrix.study_suffix }}_v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Optuna figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optuna-${{ matrix.instance }}-new-algo-30trials-figures
          path: src/optuna_figures_${{ matrix.study_suffix }}_v1/
          if-no-files-found: warn
          retention-days: 30