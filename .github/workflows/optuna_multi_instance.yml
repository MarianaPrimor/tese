name: Optuna - Multi Instance Global

on:
  workflow_dispatch:
    inputs:
      operators:
        description: "Operadores produtivos disponiveis por dia"
        required: true
        default: "20"
      june_non_working_dates:
        description: "Dias sem planeamento em junho, separados por virgulas (YYYY-MM-DD)"
        required: false
        default: ""
      july_non_working_dates:
        description: "Dias sem planeamento em julho, separados por virgulas (YYYY-MM-DD)"
        required: false
        default: ""
      august_non_working_dates:
        description: "Dias sem planeamento em agosto, separados por virgulas (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  optuna-global-study:
    name: "Optuna global June-July-August"
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Optuna checkpoints
        uses: actions/cache@v4
        with:
          path: |
            src/optuna_study_multi_instance_v1.db
            src/optuna_results_multi_instance_v1.csv
            src/optuna_seed_checkpoint_multi_instance_v1.csv
            src/optuna_configuration_multi_instance_v1.json
          key: optuna-multi-instance-v1-${{ github.run_id }}
          restore-keys: |
            optuna-multi-instance-v1-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install Optuna visualisation dependencies
        run: pip install optuna plotly "kaleido==0.2.1" scikit-learn

      - name: Run Optuna global study
        run: |
          python src/optuna_test.py \
            --study-suffix multi_instance \
            --operators "${{ inputs.operators }}" \
            --june-instance-file Inputs_June.xlsx \
            --july-instance-file Inputs_July.xlsx \
            --august-instance-file Inputs_August.xlsx \
            --june-non-working-dates "${{ inputs.june_non_working_dates }}" \
            --july-non-working-dates "${{ inputs.july_non_working_dates }}" \
            --august-non-working-dates "${{ inputs.august_non_working_dates }}"

      - name: Generate Optuna figures
        if: always()
        run: python src/generate_optuna_figures.py --study-suffix multi_instance
        continue-on-error: true

      - name: Upload study results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optuna-multi-instance-study
          path: |
            src/optuna_study_multi_instance_v1.db
            src/optuna_results_multi_instance_v1.csv
            src/optuna_seed_checkpoint_multi_instance_v1.csv
            src/optuna_configuration_multi_instance_v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Optuna figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optuna-multi-instance-figures
          path: src/optuna_figures_multi_instance_v1/
          if-no-files-found: warn
          retention-days: 30