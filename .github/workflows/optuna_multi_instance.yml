name: Optuna - Instance Studies

on:
  workflow_dispatch:
    inputs:
      operators:
        description: "Operadores produtivos disponiveis por dia"
        required: true
        default: "20"
      june_non_working_dates:
        description: "Dias sem planeamento em junho, separados por virgulas (YYYY-MM-DD)"
        required: false
        default: ""
      july_non_working_dates:
        description: "Dias sem planeamento em julho, separados por virgulas (YYYY-MM-DD)"
        required: false
        default: ""
      august_non_working_dates:
        description: "Dias sem planeamento em agosto, separados por virgulas (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  optuna-instance-study:
    name: "Optuna ${{ matrix.instance }}"
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: june
            instance_file: Inputs_June.xlsx
            non_working_dates: ${{ inputs.june_non_working_dates }}
          - instance: july
            instance_file: Inputs_July.xlsx
            non_working_dates: ${{ inputs.july_non_working_dates }}
          - instance: august
            instance_file: Inputs_August.xlsx
            non_working_dates: ${{ inputs.august_non_working_dates }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Optuna checkpoints
        uses: actions/cache@v4
        with:
          path: |
            src/optuna_study_${{ matrix.instance }}_v1.db
            src/optuna_results_${{ matrix.instance }}_v1.csv
            src/optuna_seed_checkpoint_${{ matrix.instance }}_v1.csv
            src/optuna_configuration_${{ matrix.instance }}_v1.json
          key: optuna-${{ matrix.instance }}-v1-${{ github.run_id }}
          restore-keys: |
            optuna-${{ matrix.instance }}-v1-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Install Optuna visualisation dependencies
        run: pip install optuna plotly "kaleido==0.2.1" scikit-learn

      - name: Run Optuna study
        run: |
          python src/optuna_test.py \
            --study-suffix "${{ matrix.instance }}" \
            --operators "${{ inputs.operators }}" \
            --instance-file "${{ matrix.instance_file }}" \
            --non-working-dates "${{ matrix.non_working_dates }}"

      - name: Generate Optuna figures
        if: always()
        run: python src/generate_optuna_figures.py --study-suffix "${{ matrix.instance }}"
        continue-on-error: true

      - name: Upload study results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optuna-${{ matrix.instance }}-study
          path: |
            src/optuna_study_${{ matrix.instance }}_v1.db
            src/optuna_results_${{ matrix.instance }}_v1.csv
            src/optuna_seed_checkpoint_${{ matrix.instance }}_v1.csv
            src/optuna_configuration_${{ matrix.instance }}_v1.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Optuna figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optuna-${{ matrix.instance }}-figures
          path: src/optuna_figures_${{ matrix.instance }}_v1/
          if-no-files-found: warn
          retention-days: 30